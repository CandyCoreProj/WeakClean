[package]
name = "weakclean-scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1.8.7"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
