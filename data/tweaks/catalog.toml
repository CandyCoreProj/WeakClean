# ───────── โหมดผู้เชี่ยวชาญ (ไม่รวมในโปรไฟล์ใด) ─────────

[[tweak]]
id = "vbs"
category = "expert"
risk = "expert"
reboot = true
profiles = []
name_th = "ปิด VBS / Memory Integrity (HVCI)"
name_en = "Turn off VBS / Memory Integrity (HVCI)"
desc_th = "เพิ่ม FPS ได้ในบางเกม แต่ลดการป้องกันมัลแวร์ระดับเคอร์เนล"
desc_en = "Can raise FPS in some games, but weakens kernel-level malware protection"
  [[tweak.ops]]
  type = "registry"
  hive = "HKLM"
  path = 'SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
  name = "Enabled"
  kind = "dword"
  value = 0

[[tweak]]
id = "spectre"
category = "expert"
risk = "expert"
reboot = true
profiles = []
name_th = "ปิดการป้องกัน Spectre / Meltdown"
name_en = "Turn off Spectre / Meltdown protection"
desc_th = "CPU เร็วขึ้นเล็กน้อย แต่เปิดช่องโหว่ระดับฮาร์ดแวร์"
desc_en = "The CPU gets slightly faster, but hardware-level vulnerabilities are exposed"
  [[tweak.ops]]
  type = "registry"
  hive = "HKLM"
  path = 'SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
  name = "FeatureSettingsOverride"
  kind = "dword"
  value = 3
  [[tweak.ops]]
  type = "registry"
  hive = "HKLM"
  path = 'SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
  name = "FeatureSettingsOverrideMask"
  kind = "dword"
  value = 3
