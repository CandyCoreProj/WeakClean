<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeakClean</title>
      <script>
      // ตั้งธีมตั้งแต่ก่อนวาดหน้า กันภาพวูบสว่างตอนเปิดในโหมดมืด (ตรรกะเดียวกับ src/theme.tsx)
      try {
        var p = localStorage.getItem("weakclean.theme");
        var dark = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
